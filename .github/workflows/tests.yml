name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secure_api_user
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: bashton_integration_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secure_api_user -d bashton_integration_check"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "sqlite:///:memory:"
      JWT_SECRET_KEY: ci-only-signing-key-not-for-deployment
      POSTGRES_TEST_PASSWORD: ci-only-disposable-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q
